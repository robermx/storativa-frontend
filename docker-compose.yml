services:
  frontend:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - '5174:5174'
    env_file:
      - .env.development
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      CI: 'true'
    command: sh -c "corepack enable && CI=true pnpm install && pnpm run dev"
